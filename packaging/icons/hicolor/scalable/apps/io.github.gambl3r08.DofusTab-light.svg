<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dofus-tab light">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#e1e6ed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4b41a"/>
      <stop offset="55%" stop-color="#d4920b"/>
      <stop offset="100%" stop-color="#a36d00"/>
    </linearGradient>
    <linearGradient id="tabFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8eef7"/>
      <stop offset="100%" stop-color="#d0dae8"/>
    </linearGradient>
    <linearGradient id="tabMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dce4ef"/>
      <stop offset="100%" stop-color="#c4cfdd"/>
    </linearGradient>
    <linearGradient id="tabBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cfd9e6"/>
      <stop offset="100%" stop-color="#b8c4d4"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1a2332" flood-opacity="0.18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="none" stroke="#c4cfdd" stroke-width="5"/>
  <path d="M20 128C96 56 416 56 492 128V126C416 44 96 44 20 126Z" fill="#ffffff" opacity="0.6"/>

  <!-- Stacked tabs (back → front) -->
  <g filter="url(#shadow)">
    <!-- slot 3 -->
    <rect x="150" y="196" width="260" height="78" rx="16" fill="url(#tabBack)"/>
    <rect x="150" y="196" width="260" height="78" rx="16" fill="none" stroke="#9aaac0" stroke-width="2"/>
    <circle cx="190" cy="235" r="20" fill="#ffffff"/>
    <text x="190" y="243" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" font-weight="700" fill="#6a7d94">3</text>
    <rect x="224" y="222" width="148" height="11" rx="5.5" fill="#9aaac0"/>
    <rect x="224" y="241" width="100" height="9" rx="4.5" fill="#b8c4d4"/>

    <!-- slot 2 -->
    <rect x="118" y="158" width="260" height="78" rx="16" fill="url(#tabMid)"/>
    <rect x="118" y="158" width="260" height="78" rx="16" fill="none" stroke="#8da0b8" stroke-width="2"/>
    <circle cx="158" cy="197" r="20" fill="#ffffff"/>
    <text x="158" y="205" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" font-weight="700" fill="#5a6f88">2</text>
    <rect x="192" y="184" width="148" height="11" rx="5.5" fill="#8da0b8"/>
    <rect x="192" y="203" width="100" height="9" rx="4.5" fill="#aab9cc"/>

    <!-- slot 1 active -->
    <rect x="86" y="120" width="260" height="78" rx="16" fill="url(#tabFront)"/>
    <rect x="86" y="120" width="260" height="78" rx="16" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="86" y="134" width="7" height="50" rx="3.5" fill="url(#gold)"/>
    <circle cx="126" cy="159" r="20" fill="url(#gold)"/>
    <text x="126" y="167" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" font-weight="700" fill="#3d2e05">1</text>
    <rect x="160" y="146" width="148" height="11" rx="5.5" fill="#d4920b" opacity="0.85"/>
    <rect x="160" y="165" width="100" height="9" rx="4.5" fill="#a36d00" opacity="0.45"/>
  </g>

  <!-- Focus reticle + switch chevrons -->
  <g transform="translate(256 348)" filter="url(#glow)">
    <path d="M-88 0 L-58 -22 L-58 22 Z" fill="#8da0b8"/>
    <path d="M88 0 L58 -22 L58 22 Z" fill="#8da0b8"/>
    <circle r="34" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle r="12" fill="url(#gold)"/>
    <rect x="-2.5" y="-50" width="5" height="12" rx="2.5" fill="#d4920b"/>
    <rect x="-2.5" y="38" width="5" height="12" rx="2.5" fill="#d4920b"/>
    <rect x="-50" y="-2.5" width="12" height="5" rx="2.5" fill="#d4920b"/>
    <rect x="38" y="-2.5" width="12" height="5" rx="2.5" fill="#d4920b"/>
  </g>

  <!-- slot indicators -->
  <g transform="translate(256 430)">
    <circle cx="-40" cy="0" r="8" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="8" fill="#8da0b8"/>
    <circle cx="40" cy="0" r="8" fill="#8da0b8"/>
  </g>
</svg>
