<?xml version="1.0" encoding="UTF-8"?>
<!-- Ultra-simplified 16px light mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dofus-tab light">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#e1e6ed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4b41a"/>
      <stop offset="100%" stop-color="#a36d00"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bg)"/>
  <!-- one big active tab -->
  <rect x="76" y="96" width="360" height="240" rx="36" fill="#e8eef7" stroke="url(#gold)" stroke-width="20"/>
  <rect x="76" y="124" width="36" height="184" rx="18" fill="url(#gold)"/>
  <!-- number 1 -->
  <text x="256" y="260" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="160" font-weight="700" fill="#a36d00">1</text>
</svg>
