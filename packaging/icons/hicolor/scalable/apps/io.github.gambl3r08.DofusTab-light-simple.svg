<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified light mark for 16–48px -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dofus-tab light">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#f4f6f9"/>
      <stop offset="100%" stop-color="#e1e6ed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4b41a"/>
      <stop offset="100%" stop-color="#a36d00"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bg)"/>
  <!-- back -->
  <rect x="150" y="210" width="260" height="100" rx="22" fill="#c4cfdd" stroke="#9aaac0" stroke-width="8"/>
  <!-- mid -->
  <rect x="110" y="160" width="260" height="100" rx="22" fill="#d8e0ea" stroke="#8da0b8" stroke-width="8"/>
  <!-- front active -->
  <rect x="70" y="110" width="260" height="100" rx="22" fill="#e8eef7" stroke="url(#gold)" stroke-width="14"/>
  <rect x="70" y="128" width="18" height="64" rx="9" fill="url(#gold)"/>
  <!-- focus dot -->
  <circle cx="360" cy="360" r="48" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="360" cy="360" r="20" fill="url(#gold)"/>
</svg>
