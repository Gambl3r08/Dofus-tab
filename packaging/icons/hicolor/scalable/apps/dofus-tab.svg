<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dofus-tab">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#1e2b3d"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d06a"/>
      <stop offset="55%" stop-color="#e0a93a"/>
      <stop offset="100%" stop-color="#b47d1c"/>
    </linearGradient>
    <linearGradient id="tabFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a5578"/>
      <stop offset="100%" stop-color="#243852"/>
    </linearGradient>
    <linearGradient id="tabMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3f58"/>
      <stop offset="100%" stop-color="#1c2a3c"/>
    </linearGradient>
    <linearGradient id="tabBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="100%" stop-color="#162030"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="none" stroke="#334860" stroke-width="5"/>
  <path d="M20 128C96 56 416 56 492 128V126C416 44 96 44 20 126Z" fill="#ffffff" opacity="0.05"/>

  <!-- Stacked tabs (back → front) -->
  <g filter="url(#shadow)">
    <!-- slot 3 -->
    <rect x="150" y="196" width="260" height="78" rx="16" fill="url(#tabBack)"/>
    <rect x="150" y="196" width="260" height="78" rx="16" fill="none" stroke="#3a4f68" stroke-width="2"/>
    <circle cx="190" cy="235" r="20" fill="#121a24"/>
    <text x="190" y="243" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" font-weight="700" fill="#6d829c">3</text>
    <rect x="224" y="222" width="148" height="11" rx="5.5" fill="#3a4f68"/>
    <rect x="224" y="241" width="100" height="9" rx="4.5" fill="#2a3a4e"/>

    <!-- slot 2 -->
    <rect x="118" y="158" width="260" height="78" rx="16" fill="url(#tabMid)"/>
    <rect x="118" y="158" width="260" height="78" rx="16" fill="none" stroke="#4a6480" stroke-width="2"/>
    <circle cx="158" cy="197" r="20" fill="#121a24"/>
    <text x="158" y="205" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" font-weight="700" fill="#8ea6c0">2</text>
    <rect x="192" y="184" width="148" height="11" rx="5.5" fill="#4a6480"/>
    <rect x="192" y="203" width="100" height="9" rx="4.5" fill="#354a62"/>

    <!-- slot 1 active -->
    <rect x="86" y="120" width="260" height="78" rx="16" fill="url(#tabFront)"/>
    <rect x="86" y="120" width="260" height="78" rx="16" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <rect x="86" y="134" width="7" height="50" rx="3.5" fill="url(#gold)"/>
    <circle cx="126" cy="159" r="20" fill="url(#gold)"/>
    <text x="126" y="167" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="24" font-weight="700" fill="#1a1408">1</text>
    <rect x="160" y="146" width="148" height="11" rx="5.5" fill="#f6d06a" opacity="0.9"/>
    <rect x="160" y="165" width="100" height="9" rx="4.5" fill="#c9922a" opacity="0.55"/>
  </g>

  <!-- Focus reticle + switch chevrons -->
  <g transform="translate(256 348)" filter="url(#glow)">
    <path d="M-88 0 L-58 -22 L-58 22 Z" fill="#4a6480"/>
    <path d="M88 0 L58 -22 L58 22 Z" fill="#4a6480"/>
    <circle r="34" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle r="12" fill="url(#gold)"/>
    <rect x="-2.5" y="-50" width="5" height="12" rx="2.5" fill="#f6d06a"/>
    <rect x="-2.5" y="38" width="5" height="12" rx="2.5" fill="#f6d06a"/>
    <rect x="-50" y="-2.5" width="12" height="5" rx="2.5" fill="#f6d06a"/>
    <rect x="38" y="-2.5" width="12" height="5" rx="2.5" fill="#f6d06a"/>
  </g>

  <!-- slot indicators -->
  <g transform="translate(256 430)">
    <circle cx="-40" cy="0" r="8" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="8" fill="#3a4f68"/>
    <circle cx="40" cy="0" r="8" fill="#3a4f68"/>
  </g>
</svg>
