<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified mark for 16–48px: three stacked tabs + gold accent on active -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dofus-tab">
  <defs>
    <linearGradient id="bg" x1="18%" y1="0%" x2="82%" y2="100%">
      <stop offset="0%" stop-color="#1e2b3d"/>
      <stop offset="100%" stop-color="#0b1018"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d06a"/>
      <stop offset="100%" stop-color="#b47d1c"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="472" height="472" rx="104" ry="104" fill="url(#bg)"/>
  <!-- back -->
  <rect x="150" y="210" width="260" height="100" rx="22" fill="#1c2a3c" stroke="#3a4f68" stroke-width="8"/>
  <!-- mid -->
  <rect x="110" y="160" width="260" height="100" rx="22" fill="#2a3f58" stroke="#4a6480" stroke-width="8"/>
  <!-- front active -->
  <rect x="70" y="110" width="260" height="100" rx="22" fill="#3a5578" stroke="url(#gold)" stroke-width="14"/>
  <rect x="70" y="128" width="18" height="64" rx="9" fill="url(#gold)"/>
  <!-- focus dot -->
  <circle cx="360" cy="360" r="48" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <circle cx="360" cy="360" r="20" fill="url(#gold)"/>
</svg>
