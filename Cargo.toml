[workspace]
resolver = "3"
members = ["crates/dofus-core", "crates/dofus-platform", "crates/dofus-cli", "crates/dofus-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/gambl3r08/Dofus-tab"
rust-version = "1.89"

[workspace.dependencies]
dofus-core = { path = "crates/dofus-core" }
dofus-platform = { path = "crates/dofus-platform" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = "0.13"
zbus = "5"
