[package]
name = "dofus-platform"
description = "Operating-system adapters for Dofus-tab: window managers and process inspection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dofus-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
serde.workspace = true
x11rb.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
