[package]
name = "dofus-platform"
description = "Operating-system adapters for Dofus-tab: window managers and process inspection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
dofus-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
dirs.workspace = true
serde.workspace = true
x11rb.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8.0"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSArray", "NSEnumerator"] }
sysinfo = { version = "0.36.1", default-features = false, features = ["system"] }
