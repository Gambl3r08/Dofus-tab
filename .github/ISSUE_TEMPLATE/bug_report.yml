name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most reports about this project come down to one of three things: the
        desktop never assigned the shortcut keys, the window backend cannot see
        the game, or the Ankama Launcher changed how it starts clients. The
        output of `dofus-tab doctor` distinguishes all three, so it is asked for
        first.

  - type: textarea
    id: doctor
    attributes:
      label: Output of `dofus-tab doctor`
      description: Run it with the game open, with as many clients running as usual.
      render: text
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Desktop environment and session
      description: >
        On Linux this is the part that decides most behaviour — the desktop
        implements the shortcuts portal, or does not. For example "KDE Plasma
        6.2, Wayland" or "GNOME 47, X11". On Windows and macOS the version is
        enough.
      placeholder: KDE Plasma 6.2, Wayland
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Release archive
        - Installer script from a checkout
        - cargo build, run from the checkout
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Dofus-tab version
      description: The release tag, or the commit if you built it yourself.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Optional but usually decisive. Re-run with `RUST_LOG=debug` and paste
        what it prints.
      render: text
